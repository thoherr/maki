<div class="label-picker">
    {% for l in crate::models::asset::COLOR_LABELS %}
    <span class="label-dot{% if color_label.as_deref() == Some(l.name) %} active{% endif %}"
          style="background: {{ l.hex }};"
          hx-put="/api/asset/{{ asset_id }}/label"
          hx-target="#label"
          hx-swap="innerHTML"
          hx-vals='{"label": "{% if color_label.as_deref() == Some(l.name) %}{% else %}{{ l.name }}{% endif %}"}'
          title="{% if color_label.as_deref() == Some(l.name) %}Clear label{% else %}{{ l.name }}{% endif %}"></span>
    {% endfor %}
    {% if color_label.is_some() %}
    <span class="label-name">{{ color_label.as_deref().unwrap() }}</span>
    {% endif %}
</div>
