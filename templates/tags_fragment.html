<div class="tags-section">
    {% for t in tags %}
    <span class="tag-chip">
        <a href="/?tag={{ t.value|urlencode }}" class="tag-link" onclick="sessionStorage.setItem('maki-browse-focus','{{ asset_id }}')">{{ t.value|tag_display }}</a>
        {% if let Some(badge) = t.badge %}
        <span class="tag-source-badge" title="Machine-added tag ({{ badge }}) — removable in bulk via `maki tag clear --source`">{{ badge }}</span>
        {% endif %}
        <button class="remove-tag"
                hx-delete="/api/asset/{{ asset_id }}/tags?tag={{ t.value|urlencode }}"
                hx-target="#tags"
                hx-swap="innerHTML">&times;</button>
    </span>
    {% endfor %}
    {% if tags.is_empty() %}
    <span style="color: var(--text-muted); font-size: 0.85rem;">No tags</span>
    {% else %}
    <button class="clear-tags-btn"
            hx-post="/api/asset/{{ asset_id }}/tags/clear"
            hx-target="#tags"
            hx-swap="innerHTML"
            hx-confirm="Remove all tags from this asset?"
            title="Clear all tags">&times; Clear</button>
    {% endif %}
    <form class="tag-add-form"
          hx-post="/api/asset/{{ asset_id }}/tags"
          hx-target="#tags"
          hx-swap="innerHTML">
        <span class="detail-tag-wrapper">
            <input type="text" name="tags" placeholder="Add tag..." autocomplete="off">
            <div class="tag-autocomplete detail-tag-autocomplete" id="detail-tag-autocomplete"></div>
        </span>
        <button type="submit">Add</button>
    </form>
</div>
<script>
(function() {
    var cache = window._damTagCache;
    if (!cache || Date.now() - cache.ts > 30000) {
        fetch('/api/tags')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                window._damTagCache = { tags: data.map(function(t) { return t[0]; }), ts: Date.now() };
                initDetailTagAc(window._damTagCache.tags);
            });
    } else {
        initDetailTagAc(cache.tags);
    }

    function initDetailTagAc(allTags) {
        var input = document.querySelector('#detail-tag-autocomplete').closest('form').querySelector('input[name=tags]');
        var ac = document.getElementById('detail-tag-autocomplete');
        if (!input || !ac) return;
        var acIndex = -1;

        function tagToDisplay(t) { return t; }

        // Selecting a suggestion completes it into the input and keeps the
        // dropdown open (offering deeper descendants) so hierarchical tags
        // can be extended before committing; the form submit (Enter on
        // un-highlighted input, or the Add button) is what actually adds
        // the tag. Matches the import-dialog tag picker.
        function completeInput(t) {
            input.value = tagToDisplay(t);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            showSuggestions(input.value);
        }

        function showSuggestions(query) {
            query = query.toLowerCase();
            var queryStorage = query.replace(/>/g, '|');
            var rawMatches = allTags.filter(function(t) {
                var tl = t.toLowerCase();
                return tl.indexOf(query) !== -1 || tl.indexOf(queryStorage) !== -1;
            });
            // Keep leaves AND middle-of-hierarchy tags whose own name (any
            // component) matches the query.
            var matches = rawMatches.filter(function(t) {
                var prefix = t + '|';
                var hasChild = rawMatches.some(function(other) { return other.indexOf(prefix) === 0; });
                if (!hasChild) return true;
                var components = t.toLowerCase().split('|');
                return components.some(function(c) {
                    return c.indexOf(query) !== -1 || c.indexOf(queryStorage) !== -1;
                });
            }).slice(0, 12);

            if (matches.length === 0) {
                ac.style.display = 'none';
                acIndex = -1;
                return;
            }

            ac.innerHTML = '';
            acIndex = -1;
            matches.forEach(function(t) {
                var div = document.createElement('div');
                div.className = 'tag-suggestion';
                div.setAttribute('data-tag', t);
                var parts = t.split('|');
                if (parts.length > 1) {
                    var prefix = parts.slice(0, -1).join('|') + '|';
                    div.innerHTML = '<span class="tag-path-prefix">' +
                        prefix.replace(/&/g,'&amp;').replace(/</g,'&lt;') +
                        '</span>' + parts[parts.length - 1].replace(/&/g,'&amp;').replace(/</g,'&lt;');
                } else {
                    div.textContent = tagToDisplay(t);
                }
                div.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    completeInput(t);
                });
                ac.appendChild(div);
            });
            ac.style.display = 'block';
        }

        function highlight(idx) {
            var items = ac.querySelectorAll('.tag-suggestion');
            items.forEach(function(el, i) {
                el.classList.toggle('active', i === idx);
            });
            if (idx >= 0 && items[idx]) items[idx].scrollIntoView({block: 'nearest'});
        }

        input.addEventListener('input', function() {
            var val = this.value.trim();
            if (val.length > 0) {
                showSuggestions(val);
            } else {
                ac.style.display = 'none';
                acIndex = -1;
            }
        });

        input.addEventListener('keydown', function(e) {
            var items = ac.querySelectorAll('.tag-suggestion');
            if (e.key === 'ArrowDown' && ac.style.display === 'block') {
                e.preventDefault();
                acIndex = Math.min(acIndex + 1, items.length - 1);
                highlight(acIndex);
            } else if (e.key === 'ArrowUp' && ac.style.display === 'block') {
                e.preventDefault();
                acIndex = Math.max(acIndex - 1, 0);
                highlight(acIndex);
            } else if (e.key === 'Enter' && acIndex >= 0 && items[acIndex]) {
                // Complete into the input; a second Enter (un-highlighted)
                // submits the form to actually add the tag.
                e.preventDefault();
                completeInput(items[acIndex].getAttribute('data-tag'));
            } else if (e.key === 'Tab' && ac.style.display === 'block' && items.length > 0) {
                e.preventDefault();
                completeInput(items[acIndex >= 0 ? acIndex : 0].getAttribute('data-tag'));
            } else if (e.key === 'Escape') {
                ac.style.display = 'none';
                acIndex = -1;
            }
        });

        input.addEventListener('blur', function() {
            setTimeout(function() {
                ac.style.display = 'none';
                acIndex = -1;
            }, 150);
        });

        input.addEventListener('focus', function() {
            var val = this.value.trim();
            if (val.length > 0) showSuggestions(val);
        });
    }
})();
</script>
