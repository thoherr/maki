[package]
name = "maki"
version = "4.10.2"
edition = "2021"
description = "A digital asset manager for large collections of images and videos"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
thiserror = "2"
image = "0.25"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
lofty = "0.25"
kamadak-exif = "0.6"
quick-xml = "0.41"
regex = "1"
toml = "1"
toml_edit = "0.25"
schemars = { version = "1", features = ["uuid1"] }
glob-match = "0.2"
unicode-normalization = "0.1"
rustyline = { version = "18", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
askama = "0.16"
printpdf = { version = "0.12", default-features = false, features = ["jpeg"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs"] }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

[features]
default = []
pro = ["ai"]
ai = ["ort", "ndarray", "tokenizers"]
ai-gpu = ["ai", "ort/coreml"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
sha2 = "0.11"
# Web-layer test harness: drive the axum Router in-process (no socket)
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Property-based round-trip tests for the XMP reader/writer
proptest = "1"
